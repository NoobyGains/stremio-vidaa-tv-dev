<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="shortcut icon" type="image/ico" href="assets/favicon.ico" />
    <style>
    /* =============================================================
       Stremio VIDAA TV — Nyx Player Theme v3
       Complete CSS rewrite based on Nyx Player design system
       Optimised for Chromium 88 / ARM MediaTek MT9900 GPU
       D-pad navigation with high-visibility focus states
       ============================================================= */

    /* ----- 0. DESIGN TOKENS ----- */
    :root {
        /* Base palette */
        --nyx-bg-main: #020a19;
        --nyx-bg-gradient: radial-gradient(ellipse 70% 140% at 0% 30%, rgba(104,23,23,.32) 0%, rgba(104,23,23,.1) 40%, transparent 70%),
                          radial-gradient(ellipse 140% 70% at 70% 100%, rgba(40,40,163,.3) 0%, rgba(40,40,163,.09) 40%, transparent 70%),
                          radial-gradient(ellipse 90% 90% at 0% 100%, rgba(74,16,96,.25) 0%, rgba(74,16,96,.07) 35%, transparent 60%),
                          radial-gradient(ellipse 50% 50% at 50% 45%, rgba(2,10,25,.85) 0%, transparent 75%),
                          #020a19;

        /* Surfaces — no backdrop-filter versions for perf */
        --nyx-surface-base: #020a19;
        --nyx-surface-raised: rgba(15,15,20,.45);
        --nyx-surface-modal: rgba(25,28,45,.8);
        --nyx-surface-overlay: rgba(0,0,0,.6);
        --nyx-surface-whisper: rgba(255,255,255,.03);
        --nyx-surface-card: rgba(33,38,45,.3);

        /* Glass — used sparingly (modals, player only) */
        --nyx-glass-bg-light: rgba(15,15,20,.25);
        --nyx-glass-bg: rgba(15,15,15,.45);
        --nyx-glass-bg-medium: rgba(15,15,20,.45);
        --nyx-glass-bg-heavy: rgba(15,15,20,.7);
        --nyx-glass-bg-player: rgba(0,0,0,.85);
        --nyx-glass-border: rgba(255,255,255,.08);
        --nyx-glass-blur: blur(12px) saturate(160%);
        --nyx-glass-blur-strong: blur(24px) saturate(180%);

        /* Borders */
        --nyx-border-subtle: rgba(255,255,255,.06);
        --nyx-border-default: rgba(255,255,255,.1);
        --nyx-border-glass: rgba(255,255,255,.15);
        --nyx-border-strong: rgba(255,255,255,.2);

        /* Text */
        --nyx-text-primary: #ffffff;
        --nyx-text-secondary: #c9d1d9;
        --nyx-text-muted: #8b949e;
        --nyx-text-disabled: rgba(255,255,255,.3);
        --nyx-text-icon: rgba(255,255,255,.4);

        /* Brand — Nyx red as primary, purple as accent */
        --nyx-brand: #e50914;
        --nyx-brand-hover: #ff1a25;
        --nyx-brand-subtle: rgba(229,9,20,.15);
        --nyx-brand-glow: 0 0 20px rgba(229,9,20,.4);
        --nyx-accent: #7b5bf5;
        --nyx-accent-hover: #6a4de0;
        --nyx-accent-subtle: rgba(123,91,245,.15);
        --nyx-accent-glow: 0 0 20px rgba(123,91,245,.4);

        /* Nyx palette accents */
        --nyx-blue: #2828a3;
        --nyx-blue-light: #5e6fea;
        --nyx-violet: #4a4ad0;
        --nyx-violet-subtle: rgba(74,74,208,.06);

        /* Status */
        --nyx-success: #46d369;
        --nyx-error: #ef4444;
        --nyx-warning: #f59e0b;
        --nyx-info: #58a6ff;

        /* Typography — PlusJakartaSans already loaded by Stremio */
        --nyx-font: 'PlusJakartaSans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --nyx-text-xs: .75rem;
        --nyx-text-sm: .8125rem;
        --nyx-text-md: .875rem;
        --nyx-text-base: 1rem;
        --nyx-text-lg: 1.125rem;
        --nyx-text-xl: 1.25rem;
        --nyx-text-2xl: 1.75rem;
        --nyx-text-3xl: 2.25rem;
        --nyx-text-4xl: 2.5rem;
        --nyx-text-5xl: 3.5rem;
        --nyx-leading-tight: 1.2;
        --nyx-leading-normal: 1.5;
        --nyx-leading-relaxed: 1.6;

        /* Spacing (4px base grid) */
        --nyx-sp-1: .25rem;
        --nyx-sp-2: .5rem;
        --nyx-sp-3: .75rem;
        --nyx-sp-4: 1rem;
        --nyx-sp-5: 1.25rem;
        --nyx-sp-6: 1.5rem;
        --nyx-sp-7: 1.75rem;
        --nyx-sp-8: 2rem;
        --nyx-sp-10: 2.5rem;
        --nyx-sp-12: 3rem;
        --nyx-sp-16: 4rem;

        /* Radii */
        --nyx-radius-xs: .125rem;
        --nyx-radius-sm: .25rem;
        --nyx-radius-md: .5rem;
        --nyx-radius-lg: .75rem;
        --nyx-radius-xl: 1rem;
        --nyx-radius-2xl: 1.5rem;
        --nyx-radius-pill: 2rem;
        --nyx-radius-sidebar: 2.5rem;

        /* Shadows */
        --nyx-shadow-sm: 0 2px 8px rgba(0,0,0,.2);
        --nyx-shadow-md: 0 4px 16px rgba(0,0,0,.3);
        --nyx-shadow-lg: 0 8px 32px rgba(0,0,0,.4);
        --nyx-shadow-xl: 0 12px 48px rgba(0,0,0,.6);

        /* Hover/active overlays */
        --nyx-hover-overlay: rgba(255,255,255,.06);
        --nyx-active-overlay: rgba(255,255,255,.1);

        /* Animation — GPU-friendly */
        --nyx-ease-out: cubic-bezier(.4,0,.2,1);
        --nyx-ease-bounce: cubic-bezier(.34,1.56,.64,1);
        --nyx-ease-spring: cubic-bezier(.4,0,.2,1.2);
        --nyx-duration-fast: .15s;
        --nyx-duration-normal: .25s;
        --nyx-duration-slow: .4s;

        /* Sidebar layout — Nyx floating pill (5.5rem wide, 1.5rem margin) */
        --nyx-sidebar-w: 5.5rem;
        --nyx-sidebar-m: 1.5rem;
        --nyx-sidebar-safe: calc(var(--nyx-sidebar-w) + var(--nyx-sidebar-m) * 2);
        --nyx-content-pad: var(--nyx-sp-8);
    }

    /* ----- 1. GLOBAL RESET & THEME ----- */
    html, body {
        background-color: var(--nyx-bg-main) !important;
        background-image: var(--nyx-bg-gradient) !important;
        background-attachment: fixed !important;
        color: var(--nyx-text-secondary) !important;
        font-family: var(--nyx-font) !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    #root {
        background-color: transparent !important;
        min-height: 100vh !important;
    }

    /* Theme border color on inner elements (targeted, not *) */
    #root div, #root section, #root article, #root aside, #root nav {
        border-color: var(--nyx-border-subtle) !important;
    }

    /* ----- 2. FOCUS RING — D-pad high visibility ----- */
    /* Primary focus: purple ring for all focusable elements */
    [focused],
    :focus-visible {
        outline: 2px solid var(--nyx-accent) !important;
        outline-offset: 2px !important;
    }

    :focus {
        outline: 2px solid rgba(123,91,245,.6) !important;
        outline-offset: 2px !important;
    }

    /* Buttons get slightly thicker ring */
    button:focus,
    button[focused],
    [role="button"]:focus,
    [role="button"][focused] {
        outline: 2px solid #a78bfa !important;
        outline-offset: 2px !important;
    }

    /* Cards: border glow only, no outline ring stacked on top */
    .item-_uIl6[focused],
    .item-_uIl6:focus {
        outline: none !important;
        border-color: rgba(123,91,245,.5) !important;
        box-shadow: 0 0 12px rgba(123,91,245,.25) !important;
    }

    /* Override Stremio's focused attribute styling */
    [focused] {
        outline-color: var(--nyx-accent) !important;
    }

    /* ----- 3. SCROLLBARS (hidden for TV) ----- */
    ::-webkit-scrollbar { width: 0 !important; height: 0 !important; }
    body, #root, .page-jI4PO, .home-qPkGc, .details-omgjE, .details-d5pag,
    .discover-sKRNy, .search-guyhx, .library-J0Lti, .settings-jvCLz {
        scrollbar-width: none !important;
    }

    /* ----- 4. INTERACTIVE TRANSITIONS (GPU-composited props only) ----- */
    a, button, [focused], [tabindex] {
        transition: background-color var(--nyx-duration-fast) var(--nyx-ease-out),
                    opacity var(--nyx-duration-fast) var(--nyx-ease-out),
                    transform var(--nyx-duration-fast) var(--nyx-ease-out),
                    outline-color var(--nyx-duration-fast) var(--nyx-ease-out),
                    border-color var(--nyx-duration-fast) var(--nyx-ease-out) !important;
    }

    /* ===================================================================
       5. NAVBAR → FLOATING PILL SIDEBAR (Nyx main sidebar)
       Nyx: 5.5rem wide, 1.5rem margin from edges, border-radius 2.5rem
       No backdrop-filter (ARM GPU perf) — solid dark glass instead
       =================================================================== */
    .navbar-NNb1c {
        position: fixed !important;
        left: var(--nyx-sidebar-m) !important;
        top: var(--nyx-sidebar-m) !important;
        bottom: var(--nyx-sidebar-m) !important;
        right: auto !important;
        width: var(--nyx-sidebar-w) !important;
        height: calc(100vh - var(--nyx-sidebar-m) * 2) !important;
        flex-direction: column !important;
        display: flex !important;
        align-items: center !important;
        z-index: 1000 !important;
        /* Solid glass look without backdrop-filter for ARM perf */
        background: rgba(15,15,20,.55) !important;
        border: 1px solid rgba(255,255,255,.05) !important;
        border-radius: var(--nyx-radius-sidebar) !important;
        padding: var(--nyx-sp-6) 0 !important;
        overflow: hidden !important;
        box-shadow: 0 0 40px rgba(0,0,0,.3) !important;
        transition: background-color var(--nyx-duration-slow) var(--nyx-ease-out),
                    border-color var(--nyx-duration-slow) var(--nyx-ease-out) !important;
    }

    /* Subtle hover lift on sidebar */
    .navbar-NNb1c:hover {
        background: rgba(20,20,28,.65) !important;
        border-color: rgba(255,255,255,.08) !important;
    }

    /* Hide navbar's native background layers */
    .navbar-NNb1c .background-xaXYe {
        background: transparent !important;
        display: none !important;
    }

    .navbar-NNb1c .backdrop-H4Hka {
        display: none !important;
    }

    /* Content wrapper — vertical flex layout */
    .navbar-NNb1c .content-IjaqZ {
        flex-direction: column !important;
        display: flex !important;
        height: 100% !important;
        width: 100% !important;
        padding: 0 !important;
        align-items: center !important;
        justify-content: flex-start !important;
    }

    /* Logo in sidebar — Nyx style (2.5rem, centered, glow) */
    .navbar-NNb1c .logo-lCpuw {
        width: 2.5rem !important;
        height: 2.5rem !important;
        margin: 0 auto var(--nyx-sp-8) auto !important;
        display: block !important;
        flex-shrink: 0 !important;
        filter: drop-shadow(0 0 .5rem rgba(255,255,255,.15)) !important;
        object-fit: contain !important;
    }

    /* Hide heading text */
    .navbar-NNb1c .heading-QbiVt {
        display: none !important;
    }

    /* Tab list — vertical stack with centered items, Nyx gap of 1.25rem */
    .tabs-wr1wR {
        flex-direction: column !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex: 1 !important;
        gap: var(--nyx-sp-5) !important;
        width: 100% !important;
        padding: 0 !important;
    }

    /* Individual tab — Nyx nav-item: 3.5rem round circle, icon centered */
    .tab-jVZYR {
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        width: 3.5rem !important;
        height: 3.5rem !important;
        border-radius: 50% !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        position: relative !important;
        border: none !important;
        outline: none !important;
        cursor: pointer !important;
        transition: transform var(--nyx-duration-normal) var(--nyx-ease-out),
                    background-color var(--nyx-duration-normal) var(--nyx-ease-out) !important;
    }

    /* Hide tab label text — icon only */
    .tab-jVZYR .label-l7NFN {
        display: none !important;
    }

    /* Tab icon — Nyx: 1.5rem, muted by default */
    .tab-jVZYR .icon-SZKt5 {
        width: 1.5rem !important;
        height: 1.5rem !important;
        opacity: 0.4 !important;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)) !important;
        transition: opacity var(--nyx-duration-normal) var(--nyx-ease-out),
                    filter var(--nyx-duration-normal) var(--nyx-ease-out) !important;
    }

    /* Hover / focus — Nyx hover: white bg + scale */
    .tab-jVZYR:hover,
    .tab-jVZYR[focused] {
        background: rgba(255,255,255,.08) !important;
        transform: scale(1.1) !important;
    }

    .tab-jVZYR:hover .icon-SZKt5,
    .tab-jVZYR[focused] .icon-SZKt5 {
        opacity: 1 !important;
    }

    /* Selected tab — Nyx active: red glow behind icon */
    .tab-jVZYR.selected-L5m7b {
        background: transparent !important;
    }

    .tab-jVZYR.selected-L5m7b .icon-SZKt5 {
        opacity: 1 !important;
        filter: drop-shadow(0 0 4px rgba(255,255,255,.25)) !important;
    }

    /* Red glow indicator behind active tab (Nyx active-glow) */
    .tab-jVZYR.selected-L5m7b::before {
        content: '' !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 2.5rem !important;
        height: 2.5rem !important;
        background: radial-gradient(circle, rgba(229,9,20,.8), rgba(180,7,16,.25)) !important;
        border-radius: 50% !important;
        z-index: -1 !important;
        filter: blur(8px) !important;
        opacity: 0.7 !important;
    }

    /* ===================================================================
       5b. CONTENT OFFSET — Push all pages right to clear sidebar
       =================================================================== */
    /* Main content containers — offset by sidebar safe zone */
    #root > div > div:not(.navbar-NNb1c):not(.player-SmYw4) {
        margin-left: var(--nyx-sidebar-safe) !important;
        width: calc(100% - var(--nyx-sidebar-safe)) !important;
    }

    /* Reset inner page margins (they sit inside the offset container) */
    .page-jI4PO,
    .home-qPkGc,
    .discover-sKRNy,
    .search-guyhx,
    .library-J0Lti,
    .settings-jvCLz {
        margin-left: 0 !important;
        padding-left: 0 !important;
    }

    /* Fallback: ensure page wrapper itself also clears sidebar if offset rule misses it */
    .page-jI4PO {
        padding-left: var(--nyx-sidebar-safe) !important;
        box-sizing: border-box !important;
    }

    /* ===================================================================
       6. HOME PAGE — Clean catalog rows, no hero conflict
       =================================================================== */
    .home-qPkGc {
        background-color: transparent !important;
        background: transparent !important;
        width: 100% !important;
        padding: 0 !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
    }

    /* Hide the item-preview panel on home page — it sits above the hero and creates "junk" */
    .home-qPkGc > .item-preview-nq13h,
    .home-qPkGc .item-preview-nq13h {
        display: none !important;
    }

    .home-qPkGc .content-BPvBy {
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
    }

    /* Catalog row sections — consistent horizontal padding */
    .catalog-Aq3BF {
        padding: 0 var(--nyx-content-pad) !important;
        margin-bottom: var(--nyx-sp-8) !important;
    }

    /* Catalog title — bold, readable */
    .catalog-Aq3BF .title-EqKoF {
        font-size: var(--nyx-text-xl) !important;
        font-weight: 700 !important;
        color: var(--nyx-text-primary) !important;
        margin-bottom: var(--nyx-sp-4) !important;
        padding-left: var(--nyx-sp-2) !important;
        letter-spacing: -0.01em !important;
        line-height: var(--nyx-leading-tight) !important;
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: unset !important;
    }

    /* ===================================================================
       7. DETAILS PAGE — Cinematic full-bleed backdrop
       =================================================================== */
    .details-omgjE,
    .details-d5pag {
        position: relative !important;
        width: 100% !important;
        min-height: 100vh !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        background: var(--nyx-bg-main) !important;
        padding: 0 !important;
    }

    /* Backdrop image — 60vh coverage for TV viewing distance */
    .details-omgjE .background-G0atu,
    .details-d5pag .background-G0atu {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: 60vh !important;
        object-fit: cover !important;
        z-index: 0 !important;
    }

    .details-omgjE .background-G0atu img,
    .details-d5pag .background-G0atu img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        mask-image: linear-gradient(to bottom, black 0%, black 50%, rgba(0,0,0,.4) 75%, transparent 100%) !important;
        -webkit-mask-image: linear-gradient(to bottom, black 0%, black 50%, rgba(0,0,0,.4) 75%, transparent 100%) !important;
    }

    /* Gradient overlay — smooth fade to base color */
    .details-omgjE .overlay-IpSXf,
    .details-d5pag .overlay-IpSXf {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        height: 60vh !important;
        background: linear-gradient(to top,
            var(--nyx-bg-main) 0%,
            rgba(2,10,25,.92) 20%,
            rgba(2,10,25,.55) 50%,
            rgba(2,10,25,.2) 80%,
            rgba(2,10,25,.1) 100%) !important;
        z-index: 1 !important;
    }

    /* Info section — positioned over backdrop lower third */
    .details-omgjE .info-c3Gsa,
    .details-d5pag .info-c3Gsa {
        position: relative !important;
        z-index: 2 !important;
        padding: 32vh var(--nyx-sp-12) var(--nyx-sp-8) var(--nyx-sp-12) !important;
        background: transparent !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    /* Title — large cinema headline */
    .details-omgjE .info-c3Gsa .title-OL31B,
    .details-d5pag .info-c3Gsa .title-OL31B,
    .title-OL31B {
        font-size: var(--nyx-text-4xl) !important;
        font-weight: 800 !important;
        font-style: normal !important;
        letter-spacing: -0.02em !important;
        line-height: var(--nyx-leading-tight) !important;
        color: var(--nyx-text-primary) !important;
        -webkit-text-fill-color: var(--nyx-text-primary) !important;
        text-shadow: 0 2px 20px rgba(0,0,0,.6) !important;
        margin-bottom: var(--nyx-sp-4) !important;
    }

    /* Description — readable width, relaxed leading */
    .description-Vy9xR {
        font-size: var(--nyx-text-base) !important;
        line-height: var(--nyx-leading-relaxed) !important;
        color: var(--nyx-text-secondary) !important;

    /* Video/episode title */
    .video-title-dEjBn {

    /* ===================================================================
       8. DISCOVER / BROWSE PAGE — Poster grid with constrained cards
       =================================================================== */
    .discover-sKRNy {
        background: transparent !important;
        padding: var(--nyx-sp-6) var(--nyx-content-pad) !important;
        width: 100% !important;
        box-sizing: border-box !important;
        overflow-y: auto !important;

    /* Discover/Library card containers — horizontal scroll rows */

       9. SEARCH PAGE — Centered input, clean results
       =================================================================== */
    .search-guyhx {

    .search-guyhx input,

<script>
// Smart DV/HDR stream handling
// Based on live hardware testing on Hisense PX1HE (100L5H):
// - DV+HDR in MKV at 4K: PLAYS NATIVELY (no transcoding needed)
// - DV+HDR in MP4: crashes browser (container issue)
// - Content >4K (4320p/8K upscale): black screen (decoder limit)
// - HEVC 4K 10-bit: plays fine
// - AV1: not supported
(function() {
    window.__DV_PROFILE7_DETECTED__ = false;
    window.__STREAM_INFO__ = {};

    // Monitor video element for playback failures — warn only on actual failure
    var watchInterval = null;

    function startPlaybackWatch() {
        if (watchInterval) return;
        watchInterval = setInterval(function() {
            var hash = window.location.hash || '';
            if (hash.indexOf('#/player/') !== 0) {
                if (watchInterval) { clearInterval(watchInterval); watchInterval = null; }
                return;
            }
            var video = document.querySelector('video');
            if (!video) return;

            // Check for >4K resolution (decoder limit)
            if (video.videoWidth > 4096 || video.videoHeight > 2160) {
                console.warn('[stream] Resolution ' + video.videoWidth + 'x' + video.videoHeight + ' exceeds 4K — may cause issues');
                window.__STREAM_INFO__.oversize = true;
            }

            // Detect stalled DV playback (black screen = video loads but no frames render)
            if (video.readyState >= 2 && video.currentTime === 0 && !video.paused && !video.ended) {
                // Video thinks it's playing but stuck at 0 — possible black screen
                if (!window.__STREAM_INFO__.stallCheck) {
                    window.__STREAM_INFO__.stallCheck = Date.now();
                } else if (Date.now() - window.__STREAM_INFO__.stallCheck > 8000) {
                    // 8 seconds with no progress — likely a black screen
                    console.warn('[stream] Playback stalled — possible codec/container issue');
                    showPlaybackWarning();
                    window.__STREAM_INFO__.stallCheck = null;
                }
            } else {
                window.__STREAM_INFO__.stallCheck = null;
            }
        }, 2000);
    }

    // Watch for player route
    var wasInPlayer = false;
    setInterval(function() {
        var hash = window.location.hash || '';
        var inPlayer = hash.indexOf('#/player/') === 0;
        if (inPlayer) {
            if (!wasInPlayer) { window.__STREAM_INFO__ = {}; }
            startPlaybackWatch();
        }
        if (!inPlayer) { window.__FORCE_TRANSCODE__ = false; }
        wasInPlayer = inPlayer;
    }, 1000);

    // Intercept probe responses — log codec info but DON'T block playback
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
        var result = origFetch.apply(this, arguments);
        try {
            if (typeof url === 'string' && url.indexOf('/hlsv2/') !== -1 && url.indexOf('probe') !== -1) {
                result.then(function(response) {
                    var cloned = response.clone();
                    cloned.json().then(function(data) {
                        if (data && Array.isArray(data.streams)) {
                            for (var i = 0; i < data.streams.length; i++) {
                                var s = data.streams[i];
                                if (s.track === 'video') {
                                    window.__STREAM_INFO__.videoCodec = s.codec;
                                    window.__STREAM_INFO__.width = s.width;
                                    window.__STREAM_INFO__.height = s.height;
                                    if (s.codec && /^dv(he|h1)/.test(s.codec)) {
                                        window.__DV_PROFILE7_DETECTED__ = s.codec;
                                        console.log('[DV] Detected:', s.codec, s.width + 'x' + s.height, '— letting browser attempt native playback');
                                    }
                                }
                            }
                        }
                    }).catch(function() {});
                });
            }
        } catch(e) {}
        return result;
    };

    function showPlaybackWarning() {
        var existing = document.getElementById('dv-warning');
        if (existing) return;

        var codec = window.__STREAM_INFO__.videoCodec || 'unknown';
        var res = (window.__STREAM_INFO__.width || '?') + 'x' + (window.__STREAM_INFO__.height || '?');
        var isOversize = window.__STREAM_INFO__.width > 4096 || window.__STREAM_INFO__.height > 2160;

        var overlay = document.createElement('div');
        overlay.id = 'dv-warning';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:PlusJakartaSans,sans-serif;';

        var title = isOversize ? 'Resolution Too High' : 'Playback Issue Detected';
        var detail = isOversize
            ? 'This stream is ' + esc(res) + ' which exceeds your TV\'s 4K decode limit. Try a 2160p or 1080p source instead.'
            : 'This stream (' + esc(codec) + ' @ ' + esc(res) + ') is not rendering. The container format may be incompatible. Try an MKV source, or transcode via your streaming server.';

        var inner = '<div style="font-size:2.2rem;margin-bottom:1rem;font-weight:700;">' + title + '</div>'
            + '<div style="font-size:1.1rem;color:rgba(255,255,255,0.65);margin-bottom:2rem;text-align:center;max-width:560px;line-height:1.5;">' + detail + '</div>'
            + '<div id="dv-actions" style="display:flex;gap:1.2rem;"></div>';
        overlay.innerHTML = inner;

        var actionsDiv = overlay.querySelector('#dv-actions');

        // Native Player button (VIDAA only)
        var hasNativePlayer = false;
        try { hasNativePlayer = typeof omi_platform !== 'undefined' && typeof omi_platform.sendPlatformMessage === 'function'; } catch(e) {}

        if (hasNativePlayer) {
            var nativeBtn = document.createElement('button');
            nativeBtn.textContent = 'Open in Native Player';
            nativeBtn.style.cssText = 'padding:0.9rem 2.2rem;font-size:1.1rem;background:#7b5bf5;color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;';
            nativeBtn.setAttribute('tabindex', '0');
            nativeBtn.onfocus = function() { this.style.outline = '3px solid #a78bfa'; };
            nativeBtn.onblur = function() { this.style.outline = 'none'; };
            nativeBtn.onclick = function() {
                window.__STREAM_INFO__.stallCheck = null;
                var video = document.querySelector('video');
                var streamUrl = video ? video.currentSrc || video.src : null;
                if (streamUrl) {
                    window.__launchNativePlayer(streamUrl);
                    overlay.remove();

            actionsDiv.appendChild(nativeBtn);
        }

        var transBtn = document.createElement('button');
        transBtn.textContent = 'Force Transcode';
        transBtn.style.cssText = 'padding:0.9rem 2.2rem;font-size:1.1rem;background:' + (hasNativePlayer ? 'rgba(255,255,255,0.1)' : '#7b5bf5') + ';color:white;border:' + (hasNativePlayer ? '1px solid rgba(255,255,255,0.25)' : 'none') + ';border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;';
        transBtn.setAttribute('tabindex', '0');
        transBtn.onfocus = function() { this.style.outline = '3px solid #a78bfa'; };
        transBtn.onblur = function() { this.style.outline = 'none'; };
        transBtn.onclick = function() {
            window.__STREAM_INFO__.stallCheck = null;
            window.__FORCE_TRANSCODE__ = true;
            overlay.remove();
            var ch = window.location.hash;
            window.location.hash = '#/home';
            setTimeout(function() { window.location.hash = ch; }, 100);
        };
        actionsDiv.appendChild(transBtn);

        var skipBtn = document.createElement('button');
        skipBtn.textContent = 'Try Another Source';
        skipBtn.style.cssText = 'padding:0.9rem 2.2rem;font-size:1.1rem;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.25);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;';
        skipBtn.setAttribute('tabindex', '0');
        skipBtn.onfocus = function() { this.style.outline = '3px solid #a78bfa'; };
        skipBtn.onblur = function() { this.style.outline = 'none'; };
        skipBtn.onclick = function() {
            window.__STREAM_INFO__.stallCheck = null;
            overlay.remove();
            window.history.back();
        };
        actionsDiv.appendChild(skipBtn);

        var dismissBtn = document.createElement('button');
        dismissBtn.textContent = 'Dismiss';
        dismissBtn.style.cssText = 'padding:0.9rem 2.2rem;font-size:1.1rem;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;';
        dismissBtn.setAttribute('tabindex', '0');
        dismissBtn.onfocus = function() { this.style.outline = '3px solid #a78bfa'; };
        dismissBtn.onblur = function() { this.style.outline = 'none'; };
        dismissBtn.onclick = function() { window.__STREAM_INFO__.stallCheck = null; overlay.remove(); };
        actionsDiv.appendChild(dismissBtn);

        document.body.appendChild(overlay);
        setTimeout(function() { transBtn.focus(); }, 100);
    }
    window.__showPlaybackWarning = showPlaybackWarning;
})();
</script>

(function() {

        for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
                if (added[j].nodeType !== 1) continue;
                var imgs = added[j].querySelectorAll ? added[j].querySelectorAll('img:not([loading])') : [];
                for (var k = 0; k < imgs.length; k++) {
                    imgs[k].setAttribute('loading', 'lazy');
                }
                if (added[j].tagName === 'IMG' && !added[j].getAttribute('loading')) {

                }
            }
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });
})();

<!-- SHARED ROUTE SYSTEM -->
<!-- Single setInterval that dispatches to registered component handlers -->
<!-- ----------------------------------------------------------------------------- -->
<script>
(function() {
    'use strict';

    // Route registry — components register their handlers here
    window.__ROUTE_HANDLERS__ = window.__ROUTE_HANDLERS__ || [];

    var lastHash = '';
    var lastRoute = '';

    function classifyRoute(hash) {
        if (!hash || hash === '#/' || hash === '#/home' || hash.indexOf('#/board') === 0) return 'home';
        if (hash.indexOf('#/detail/') === 0) return 'detail';
        return 'other';
    }

    setInterval(function() {
        var hash = window.location.hash || '';
        var route = classifyRoute(hash);
        var changed = (route !== lastRoute);
        var hashChanged = (hash !== lastHash);

        if (changed) {
            // Notify leave for old route
            for (var i = 0; i < window.__ROUTE_HANDLERS__.length; i++) {
                var h = window.__ROUTE_HANDLERS__[i];
                if (h.route === lastRoute && typeof h.onLeave === 'function') {
                    try { h.onLeave(); } catch (e) { console.error('[route] onLeave error:', e); }
                }
            }
            // Notify enter for new route
            for (var j = 0; j < window.__ROUTE_HANDLERS__.length; j++) {
                var h2 = window.__ROUTE_HANDLERS__[j];
                if (h2.route === route && typeof h2.onEnter === 'function') {
                    try { h2.onEnter(hash); } catch (e) { console.error('[route] onEnter error:', e); }
                }
            }
        } else if (hashChanged) {
            // Same route type but different hash (e.g. different detail page)
            for (var k = 0; k < window.__ROUTE_HANDLERS__.length; k++) {
                var h3 = window.__ROUTE_HANDLERS__[k];
                if (h3.route === route && typeof h3.onHashChange === 'function') {
                    try { h3.onHashChange(hash); } catch (e) { console.error('[route] onHashChange error:', e); }
                }
            }
        }

        // Tick for current route (re-injection if React removed our DOM)
        for (var m = 0; m < window.__ROUTE_HANDLERS__.length; m++) {
            var h4 = window.__ROUTE_HANDLERS__[m];
            if (h4.route === route && typeof h4.onTick === 'function') {
                try { h4.onTick(hash); } catch (e) { /* silent */ }
            }
        }

        lastHash = hash;
        lastRoute = route;
    }, 600);
})();
</script>

<script>
(function() {

    var CINEMETA_MOVIE_URL = 'https://v3-cinemeta.strem.io/catalog/movie/top.json';
    var HERO_COUNT = 6;
    var ROTATE_MS = 8000;
    var heroIndex = 0;
    var heroTimer = null;

    // --- Data Fetching ---

    function fetchHeroData(cb) {
        if (heroData) { cb(heroData); return; }
        if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; cb(heroData); return; }

        fetch(CINEMETA_MOVIE_URL).then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(function(data) {
            var metas = (data && data.metas) ? data.metas : [];
            // Filter to items with backgrounds for hero quality
            var withBg = [];
            for (var i = 0; i < metas.length; i++) {
                if (metas[i].background) withBg.push(metas[i]);
            }
            heroData = withBg.length >= HERO_COUNT ? withBg : metas;
            window.__HERO_DATA__ = heroData;
            cb(heroData);

            console.error('[hero] Fetch failed:', e);
            cb([]);

        var items = metas.slice(0, HERO_COUNT);

            slide.setAttribute('data-index', String(i));

            // Background

            gradBottom.className = 'hero-grad-bottom';

            var gradSide = document.createElement('div');

            content.className = 'hero-content';

            // Metadata pills

            pills.className = 'hero-pills';

            if (item.year) {

            if (item.imdbRating) {

                var gc = Math.min(item.genres.length, 3);
                for (var g = 0; g < gc; g++) {
                    var gp = document.createElement('span');
                    gp.className = 'hero-pill';
                    gp.textContent = item.genres[g];
                    pills.appendChild(gp);
                }
            }
            content.appendChild(pills);

            // Title
            var title = document.createElement('div');
            title.className = 'hero-title';
            title.textContent = item.name || '';
            content.appendChild(title);

            // Description
            var desc = document.createElement('div');
            desc.className = 'hero-desc';
            desc.textContent = truncate(item.description || '', 180);
            content.appendChild(desc);

            // Buttons
            var btnRow = document.createElement('div');
            btnRow.className = 'hero-buttons';

            var watchBtn = createHeroButton(item, 'Watch', true);
            btnRow.appendChild(watchBtn);

            var detailBtn = createHeroButton(item, 'Details', false);
            btnRow.appendChild(detailBtn);

            content.appendChild(btnRow);
            slide.appendChild(content);
            slidesContainer.appendChild(slide);
        }

        wrap.appendChild(slidesContainer);

        // Pagination dots
        var dotsWrap = document.createElement('div');
        dotsWrap.id = 'hero-dots';
        for (var d = 0; d < items.length; d++) {
            var dot = document.createElement('button');
            dot.className = 'hero-dot' + (d === 0 ? ' active' : '');
            dot.setAttribute('data-dot', String(d));
            dot.setAttribute('tabindex', '-1');
            dot.setAttribute('aria-label', 'Slide ' + (d + 1));
            (function(idx) {
                dot.onclick = function() { goToSlide(idx); };
            })(d);
            dotsWrap.appendChild(dot);
        }
        wrap.appendChild(dotsWrap);

        frag.appendChild(wrap);
        return frag;
    }

    function createHeroButton(item, label, isPrimary) {
        var btn = document.createElement('button');
        btn.setAttribute('tabindex', '0');
        btn.setAttribute('data-hero-btn', label.toLowerCase());
        btn.setAttribute('data-type', item.type || 'movie');
        btn.setAttribute('data-id', item.id || '');
        btn.setAttribute('aria-label', label + ' ' + (item.name || ''));
        btn.className = 'hero-btn ' + (isPrimary ? 'hero-btn--primary' : 'hero-btn--secondary');
        btn.textContent = label;

        btn.onfocus = function() {
            focusPaused = true;
            pauseTimer();
        };
        btn.onblur = function() {
            focusPaused = false;
            startTimer();
        };
        btn.onclick = function() {
            var t = this.getAttribute('data-type');
            var id = this.getAttribute('data-id');
            if (t && id) window.location.hash = '#/detail/' + t + '/' + id;
        };
        btn.onkeydown = function(e) {
            if (e.keyCode === 13 || e.keyCode === 32) {
                this.click();
                e.preventDefault();
                return;
            }
            // Left/Right between hero buttons
            if (e.keyCode === 39) { // Right
                var next = this.nextElementSibling;
                if (next && next.classList.contains('hero-btn')) {
                    next.focus();
                    e.preventDefault();
                    e.stopPropagation();
                }
            } else if (e.keyCode === 37) { // Left
                var prev = this.previousElementSibling;
                if (prev && prev.classList.contains('hero-btn')) {
                    prev.focus();
                    e.preventDefault();
                    e.stopPropagation();
                } else {
                    // Left on first button = previous slide
                    goToSlide(heroIndex - 1 < 0 ? HERO_COUNT - 1 : heroIndex - 1);
                    e.preventDefault();
                    e.stopPropagation();
                }
            } else if (e.keyCode === 40) { // Down — move focus to trending row
                var firstCard = document.querySelector('.trending-card');
                if (firstCard) {
                    firstCard.focus();
                    e.preventDefault();
                    e.stopPropagation();
                }
            } else if (e.keyCode === 39 && !this.nextElementSibling) {
                // Right on last button = next slide
                goToSlide(heroIndex + 1);
                e.preventDefault();
                e.stopPropagation();
            }
        };

        return btn;
    }

    // --- Slide Navigation ---

    function goToSlide(idx) {
        var slides = document.querySelectorAll('#stremio-hero .hero-slide');
        if (!slides.length) return;
        heroIndex = ((idx % slides.length) + slides.length) % slides.length;

        requestAnimationFrame(function() {
            for (var i = 0; i < slides.length; i++) {
                if (i === heroIndex) {
                    slides[i].classList.add('active');
                } else {
                    slides[i].classList.remove('active');
                }
            }
            var dots = document.querySelectorAll('#hero-dots .hero-dot');
            for (var j = 0; j < dots.length; j++) {
                if (j === heroIndex) {
                    dots[j].classList.add('active');
                } else {
                    dots[j].classList.remove('active');
                }
            }
        });

        if (!focusPaused) {
            startTimer();
        }
    }

    function nextSlide() {
        goToSlide(heroIndex + 1);
    }

    function startTimer() {
        if (heroTimer) clearInterval(heroTimer);
        heroTimer = setInterval(nextSlide, ROTATE_MS);
    }

    function pauseTimer() {
        if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
    }

    // --- Stremio Catalog Visibility ---

    function hideCatalogs() {
        var catalogs = document.querySelectorAll('.catalog-Aq3BF');
        for (var i = 0; i < catalogs.length; i++) {
            catalogs[i].setAttribute('data-hero-hidden', 'true');
            catalogs[i].style.display = 'none';
        }
    }

    function restoreCatalogs() {
        var catalogs = document.querySelectorAll('[data-hero-hidden="true"]');
        for (var i = 0; i < catalogs.length; i++) {
            catalogs[i].style.display = '';
            catalogs[i].removeAttribute('data-hero-hidden');
        }
    }

    // --- Injection & Cleanup ---

    function inject() {
        if (document.getElementById('stremio-hero')) return;

        var homeEl = document.querySelector('.home-qPkGc');
        if (!homeEl) return;

        var contentEl = homeEl.querySelector('.content-BPvBy');
        if (!contentEl) return;

        fetchHeroData(function(metas) {
            if (!metas.length) return;
            if (document.getElementById('stremio-hero')) return;

            // Hide Stremio's catalog rows so hero is the primary content
            hideCatalogs();

            var heroFrag = buildHero(metas);
            if (heroFrag) {
                contentEl.insertBefore(heroFrag, contentEl.firstChild);
                startTimer();
            }
        });
    }

    function cleanup() {
        var hero = document.getElementById('stremio-hero');
        if (hero) hero.parentNode.removeChild(hero);
        pauseTimer();
        heroIndex = 0;
        restoreCatalogs();
    }

    // --- Register with Route System ---

    window.__ROUTE_HANDLERS__.push({
        route: 'home',
        onEnter: function() {
            setTimeout(inject, 400);
        },
        onLeave: function() {
            cleanup();
        },
        onTick: function() {
            // Re-inject if React re-rendered and removed our hero
            if (!document.getElementById('stremio-hero')) {
                inject();
            }
            // Re-hide catalogs if React re-rendered them
            var hero = document.getElementById('stremio-hero');
            if (hero) {
                var visibleCatalogs = document.querySelectorAll('.catalog-Aq3BF:not([data-hero-hidden])');
                if (visibleCatalogs.length > 0) {
                    hideCatalogs();
                }
            }
        }
    });
})();
</script>

<!-- ----------------------------------------------------------------------------- -->
<!-- TRENDING ROW COMPONENT -->
<!-- Horizontal scrollable poster row with D-pad navigation -->
<!-- Fetches both movies and series for variety -->
<!-- ----------------------------------------------------------------------------- -->
<script>
(function() {
    'use strict';

    var CINEMETA_MOVIE_URL = 'https://v3-cinemeta.strem.io/catalog/movie/top.json';
    var CINEMETA_SERIES_URL = 'https://v3-cinemeta.strem.io/catalog/series/top.json';
    var CARD_COUNT = 20;
    var trendingData = null;

    // --- Data Fetching ---

    function fetchTrendingData(cb) {
        if (trendingData) { cb(trendingData); return; }

        var moviesDone = false;
        var seriesDone = false;
        var movies = [];
        var series = [];

        function maybeMerge() {
            if (!moviesDone || !seriesDone) return;
            // Interleave movies and series for variety
            var merged = [];
            var mi = 0, si = 0;
            while (merged.length < CARD_COUNT && (mi < movies.length || si < series.length)) {
                if (mi < movies.length) merged.push(movies[mi++]);
                if (si < series.length && merged.length < CARD_COUNT) merged.push(series[si++]);
            }
            trendingData = merged;
            cb(merged);
        }

        // Reuse hero data for movies if available
        if (window.__HERO_DATA__) {
            movies = window.__HERO_DATA__;
            moviesDone = true;
        } else {
            fetch(CINEMETA_MOVIE_URL).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }).then(function(data) {
                movies = (data && data.metas) ? data.metas : [];
                window.__HERO_DATA__ = movies;
            }).catch(function(e) {
                console.error('[trending] Movie fetch failed:', e);
            }).then(function() {
                moviesDone = true;
                maybeMerge();
            });
        }

        fetch(CINEMETA_SERIES_URL).then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(function(data) {
            series = (data && data.metas) ? data.metas : [];
        }).catch(function(e) {
            console.error('[trending] Series fetch failed:', e);
        }).then(function() {
            seriesDone = true;
            maybeMerge();
        });

        // If movies were already cached, trigger merge check
        if (moviesDone) maybeMerge();
    }

    // --- DOM Building ---

    function buildTrendingRow(metas) {
        if (!metas.length) return null;

        var frag = document.createDocumentFragment();
        var section = document.createElement('div');
        section.id = 'stremio-trending';

        // Heading with accent bar
        var heading = document.createElement('div');
        heading.className = 'trending-heading';
        var accent = document.createElement('span');
        accent.className = 'trending-accent';
        heading.appendChild(accent);
        var headingText = document.createTextNode('Trending Now');
        heading.appendChild(headingText);
        section.appendChild(heading);

        // Scroll container
        var scrollWrap = document.createElement('div');
        scrollWrap.id = 'trending-scroll';

        for (var i = 0; i < metas.length; i++) {
            var item = metas[i];
            var card = document.createElement('div');
            card.className = 'trending-card';
            card.setAttribute('tabindex', '0');
            card.setAttribute('data-trending-id', item.id || '');
            card.setAttribute('data-trending-type', item.type || 'movie');
            card.setAttribute('aria-label', (item.name || '') + (item.imdbRating ? ', rated ' + item.imdbRating : ''));

            // Poster image
            var poster = document.createElement('img');
            poster.className = 'card-poster';
            poster.setAttribute('loading', 'lazy');
            poster.alt = item.name || '';
            // Use smaller poster URL if available
            poster.src = item.poster || '';
            poster.onerror = function() { this.style.background = '#1a1a2e'; this.removeAttribute('src'); };
            card.appendChild(poster);

            // Type badge (corner bracket style)
            var typeBadge = document.createElement('div');
            typeBadge.className = 'card-badge ' + (item.type === 'series' ? 'card-badge--series' : 'card-badge--movie');
            typeBadge.textContent = item.type === 'series' ? 'Series' : 'Movie';
            card.appendChild(typeBadge);

            // Rating badge
            if (item.imdbRating) {
                var rBadge = document.createElement('div');
                rBadge.className = 'card-rating';
                rBadge.textContent = '\u2605 ' + item.imdbRating;
                card.appendChild(rBadge);
            }

            // Title below poster
            var cardTitle = document.createElement('div');
            cardTitle.className = 'card-title';
            cardTitle.textContent = item.name || '';
            card.appendChild(cardTitle);

            // Click handler
            card.onclick = function() {
                var t = this.getAttribute('data-trending-type');
                var id = this.getAttribute('data-trending-id');
                if (t && id) window.location.hash = '#/detail/' + t + '/' + id;
            };
            card.onkeydown = function(e) {
                if (e.keyCode === 13 || e.keyCode === 32) {
                    this.click();
                    e.preventDefault();
                    return;
                }
            };

            scrollWrap.appendChild(card);
        }

        section.appendChild(scrollWrap);

        // D-pad navigation for trending cards
        scrollWrap.addEventListener('keydown', function(e) {
            var focused = document.activeElement;
            if (!focused || !focused.classList.contains('trending-card')) return;

            if (e.keyCode === 39) { // Right
                var next = focused.nextElementSibling;
                if (next && next.classList.contains('trending-card')) {
                    next.focus();
                    e.preventDefault();
                    e.stopPropagation();
                }
            } else if (e.keyCode === 37) { // Left
                var prev = focused.previousElementSibling;
                if (prev && prev.classList.contains('trending-card')) {
                    prev.focus();
                    e.preventDefault();
                    e.stopPropagation();
                }
            } else if (e.keyCode === 38) { // Up — go to hero buttons
                var heroBtn = document.querySelector('#stremio-hero .hero-btn--primary');
                if (heroBtn) {
                    heroBtn.focus();
                    e.preventDefault();
                    e.stopPropagation();
                }
            }
            // Down is left to Stremio's native navigation below
        });

        // Ensure focused card scrolls into view
        scrollWrap.addEventListener('focus', function(e) {
            if (e.target && e.target.classList.contains('trending-card')) {
                e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
            }
        }, true);

        frag.appendChild(section);
        return frag;
    }

    // --- Injection & Cleanup ---

    function inject() {
        if (document.getElementById('stremio-trending')) return;

        var homeEl = document.querySelector('.home-qPkGc');
        if (!homeEl) return;

        var contentEl = homeEl.querySelector('.content-BPvBy');
        if (!contentEl) return;

        fetchTrendingData(function(metas) {
            if (!metas.length) return;
            if (document.getElementById('stremio-trending')) return;

            var trendingFrag = buildTrendingRow(metas);
            if (trendingFrag) {
                // Insert after hero if it exists, otherwise at top
                var heroEl = document.getElementById('stremio-hero');
                if (heroEl && heroEl.nextSibling) {
                    contentEl.insertBefore(trendingFrag, heroEl.nextSibling);
                } else if (heroEl) {
                    contentEl.appendChild(trendingFrag);
                } else {
                    contentEl.insertBefore(trendingFrag, contentEl.firstChild);
                }
            }
        });
    }

    function cleanup() {
        var trending = document.getElementById('stremio-trending');
        if (trending && trending.parentNode) trending.parentNode.removeChild(trending);
    }

    // --- Register with Route System ---

    window.__ROUTE_HANDLERS__.push({
        route: 'home',
        onEnter: function() {
            // Slight extra delay to let hero inject first
            setTimeout(inject, 600);
        },
        onLeave: function() {
            cleanup();
        },
        onTick: function() {
            if (!document.getElementById('stremio-trending')) {
                inject();
            }
        }
    });
})();
</script>

<!-- ----------------------------------------------------------------------------- -->
<!-- DETAIL PAGE PILLS COMPONENT -->
<!-- Frosted glass metadata pills injected below the title on detail pages -->
<!-- Uses __META_CACHE__ for caching, handles React re-renders -->
<!-- ----------------------------------------------------------------------------- -->
<script>
(function() {
    'use strict';

    var currentDetailHash = '';
    var retryCount = 0;
    var MAX_RETRIES = 8;

    // --- DOM Building ---

    function buildPills(meta) {
        var frag = document.createDocumentFragment();
        var container = document.createElement('div');
        container.id = 'stremio-detail-pills';

        // Type pill
        if (meta.type) {
            var tp = document.createElement('span');
            tp.className = 'detail-pill detail-pill--type';
            tp.textContent = meta.type === 'movie' ? 'Movie' : meta.type === 'series' ? 'Series' : meta.type;
            container.appendChild(tp);
        }

        // Year pill
        if (meta.releaseInfo || meta.year) {
            var yp = document.createElement('span');
            yp.className = 'detail-pill detail-pill--default';
            yp.textContent = String(meta.releaseInfo || meta.year);
            container.appendChild(yp);
        }

        // Runtime pill
        if (meta.runtime) {
            var rtp = document.createElement('span');
            rtp.className = 'detail-pill detail-pill--default';
            rtp.textContent = meta.runtime;
            container.appendChild(rtp);
        }

        // IMDb rating pill
        if (meta.imdbRating) {
            var rp = document.createElement('span');
            rp.className = 'detail-pill detail-pill--rating';
            rp.textContent = '\u2605 ' + meta.imdbRating;
            container.appendChild(rp);
        }

        // Genre pills (max 4)
        if (meta.genres && meta.genres.length) {
            var gc = Math.min(meta.genres.length, 4);
            for (var i = 0; i < gc; i++) {
                var gp = document.createElement('span');
                gp.className = 'detail-pill detail-pill--genre';
                gp.textContent = meta.genres[i];
                container.appendChild(gp);
            }
        }

        frag.appendChild(container);
        return frag;
    }

    function insertPills(meta) {
        if (document.getElementById('stremio-detail-pills')) return true;

        // Find Stremio's detail page info section
        var infoEl = document.querySelector('.info-c3Gsa');
        if (!infoEl) return false;

        var titleEl = infoEl.querySelector('.title-OL31B');
        if (!titleEl) return false;

        var descEl = infoEl.querySelector('.description-Vy9xR');
        var pillsFrag = buildPills(meta);

        if (descEl) {
            infoEl.insertBefore(pillsFrag, descEl);
        } else if (titleEl.nextSibling) {
            infoEl.insertBefore(pillsFrag, titleEl.nextSibling);
        } else {
            infoEl.appendChild(pillsFrag);
        }
        return true;
    }

    // --- Data Fetching ---

    function fetchAndInject(type, metaId) {
        var cacheKey = type + '/' + metaId;

        // Check cache first
        if (window.__META_CACHE__ && window.__META_CACHE__[cacheKey]) {
            insertPills(window.__META_CACHE__[cacheKey]);
            return;
        }

        var apiUrl = 'https://v3-cinemeta.strem.io/meta/' + encodeURIComponent(type) + '/' + encodeURIComponent(metaId) + '.json';

        fetch(apiUrl).then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(function(data) {
            if (!data || !data.meta) return;

            // Cache the meta
            if (window.__META_CACHE__) {
                window.__META_CACHE__[cacheKey] = data.meta;
            }

            // Only inject if we're still on the same detail page
            var currentHash = window.location.hash || '';
            if (currentHash.indexOf('#/detail/' + type + '/' + metaId) !== 0) return;

            if (!insertPills(data.meta)) {
                // DOM not ready yet, will retry on next tick
                retryCount = 0;
            }
        }).catch(function(e) {
            console.error('[detail-pills] Fetch failed:', e);
        });
    }

    // --- Parse Detail Hash ---

    function parseDetailHash(hash) {
        // Format: #/detail/{type}/{id} or #/detail/{type}/{id}/{videoId}
        var match = hash.replace('#/detail/', '').split('/');
        if (match.length < 2) return null;
        return { type: match[0], id: match[1] };
    }

    // --- Injection & Cleanup ---

    function inject(hash) {
        var parsed = parseDetailHash(hash);
        if (!parsed) return;
        retryCount = 0;
        currentDetailHash = hash;

        // Small delay for Stremio's React to render the detail page
        setTimeout(function() {
            fetchAndInject(parsed.type, parsed.id);
        }, 500);
    }

    function cleanup() {
        var pills = document.getElementById('stremio-detail-pills');
        if (pills && pills.parentNode) pills.parentNode.removeChild(pills);
        currentDetailHash = '';
        retryCount = 0;
    }

    // --- Register with Route System ---

    window.__ROUTE_HANDLERS__.push({
        route: 'detail',
        onEnter: function(hash) {
            inject(hash);
        },
        onLeave: function() {
            cleanup();
        },
        onHashChange: function(hash) {
            // Different detail page — clean up and re-inject
            cleanup();
            inject(hash);
        },
        onTick: function(hash) {
            // Handle React re-renders that remove our pills
            if (!document.getElementById('stremio-detail-pills') && currentDetailHash === hash) {
                retryCount++;
                if (retryCount <= MAX_RETRIES) {
                    var parsed = parseDetailHash(hash);
                    if (parsed) {
                        var cacheKey = parsed.type + '/' + parsed.id;
                        if (window.__META_CACHE__ && window.__META_CACHE__[cacheKey]) {
                            insertPills(window.__META_CACHE__[cacheKey]);
                        }
                    }
                }
            }
        }
    });
})();
</script>
